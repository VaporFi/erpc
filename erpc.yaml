logLevel: warn

server:
  listenV4: true
  httpHostV4: "0.0.0.0"
  listenV6: false
  httpPort: 4000
  maxTimeout: 30s

metrics:
  enabled: true
  listenV4: true
  hostV4: "0.0.0.0"
  listenV6: false
  port: 4001

projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 43114
      - architecture: evm
        evm:
          chainId: 40
      - architecture: evm
        evm:
          chainId: 8453
    upstreams:
      - id: avalanche-api
        endpoint: https://api.avax.network/ext/bc/C/rpc
        autoIgnoreUnsupportedMethods: false
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: avalanche-publicnode
        endpoint: https://avalanche-c-chain-rpc.publicnode.com
        # PublicNode rejects backfill logs and returns null for old blocks.
        # Use avalanche-api for logs; avalanche-api/dRPC for historical blocks.
        ignoreMethods:
          - eth_getLogs
          - eth_getBlockByNumber
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: avalanche-drpc
        endpoint: https://avalanche.drpc.org
        autoIgnoreUnsupportedMethods: false
        # Verified block/log reads, including historical logs. No archive eth_call claim.
        ignoreMethods: ["*"]
        allowMethods:
          - eth_chainId
          - eth_blockNumber
          - eth_getBlockByNumber
          - eth_getLogs
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: telos-rpc
        endpoint: https://rpc.telos.net
        evm:
          chainId: 40
          skipSyncingCheck: true
      - id: telos-1rpc
        endpoint: https://1rpc.io/telos/evm
        evm:
          chainId: 40
          skipSyncingCheck: true
      - id: base-mainnet
        endpoint: https://mainnet.base.org
        autoIgnoreUnsupportedMethods: false
        evm:
          chainId: 8453
          skipSyncingCheck: true
      - id: base-publicnode
        endpoint: https://base-rpc.publicnode.com
        # Historical log requests require a PublicNode token; use base-mainnet.
        ignoreMethods:
          - eth_getLogs
        evm:
          chainId: 8453
          skipSyncingCheck: true
