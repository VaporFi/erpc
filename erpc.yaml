logLevel: warn

server:
  listenV4: true
  httpHostV4: "0.0.0.0"
  listenV6: false
  httpPort: 4000
  maxTimeout: 30s

metrics:
  enabled: true
  listenV4: true
  hostV4: "0.0.0.0"
  listenV6: false
  port: 4001

rateLimiters:
  budgets:
    - id: base-mainnet
      rules:
        - method: "*"
          maxCount: 5
          period: 1s

projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 43114
      - architecture: evm
        evm:
          chainId: 40
      - architecture: evm
        evm:
          chainId: 8453
          getLogsSplitOnError: true
    upstreams:
      - id: avalanche-api
        endpoint: https://api.avax.network/ext/bc/C/rpc
        autoIgnoreUnsupportedMethods: false
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: avalanche-publicnode
        endpoint: https://avalanche-c-chain-rpc.publicnode.com
        # PublicNode rejects backfill logs and returns null for old blocks.
        # Use avalanche-api for logs; avalanche-api/dRPC for historical blocks.
        ignoreMethods:
          - eth_getLogs
          - eth_getBlockByNumber
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: avalanche-drpc
        endpoint: https://avalanche.drpc.org
        autoIgnoreUnsupportedMethods: false
        # Verified block/log reads, including historical logs. No archive eth_call claim.
        ignoreMethods: ["*"]
        allowMethods:
          - eth_chainId
          - eth_blockNumber
          - eth_getBlockByNumber
          - eth_getLogs
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: avalanche-tenderly
        endpoint: https://avalanche.gateway.tenderly.co
        autoIgnoreUnsupportedMethods: false
        # Public gateway, no key. Verified for historical logs (220 days), 200
        # address filters and ranges up to 10000 blocks. It answers HTTP 429
        # above about 8 requests per second per IP. Do not add a rateLimitBudget:
        # an exhausted budget returns HTTP 200 with error -32005, and Ponder
        # only slows down on a real HTTP 429.
        ignoreMethods: ["*"]
        allowMethods:
          - eth_chainId
          - eth_blockNumber
          - eth_getBlockByNumber
          - eth_getLogs
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: telos-rpc
        endpoint: https://rpc.telos.net
        evm:
          chainId: 40
          skipSyncingCheck: true
      - id: telos-1rpc
        endpoint: https://1rpc.io/telos/evm
        evm:
          chainId: 40
          skipSyncingCheck: true
      - id: base-mainnet
        endpoint: https://mainnet.base.org
        autoIgnoreUnsupportedMethods: false
        # The public endpoint allows 5 requests per second per IP.
        rateLimitBudget: base-mainnet
        evm:
          chainId: 8453
          skipSyncingCheck: true
      - id: base-publicnode
        endpoint: https://base-rpc.publicnode.com
        # PublicNode serves logs for recent blocks only (about 30 days, 20000
        # results per request) and rejects older ranges without a token.
        autoIgnoreUnsupportedMethods: false
        evm:
          chainId: 8453
          skipSyncingCheck: true
          maxAvailableRecentBlocks: 1000000
      - id: base-tenderly
        endpoint: https://base.gateway.tenderly.co
        # Verified for historical logs. Rejects ranges over about 500 blocks.
        autoIgnoreUnsupportedMethods: false
        ignoreMethods: ["*"]
        allowMethods:
          - eth_chainId
          - eth_blockNumber
          - eth_getBlockByNumber
          - eth_getLogs
        evm:
          chainId: 8453
          skipSyncingCheck: true
