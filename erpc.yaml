logLevel: warn

server:
  listenV4: true
  httpHostV4: "0.0.0.0"
  listenV6: false
  httpPort: 4000
  maxTimeout: 30s

metrics:
  enabled: true
  listenV4: true
  hostV4: "0.0.0.0"
  listenV6: false
  port: 4001

projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 43114
      - architecture: evm
        evm:
          chainId: 40
      - architecture: evm
        evm:
          chainId: 8453
    upstreams:
      - id: avalanche-api
        endpoint: https://api.avax.network/ext/bc/C/rpc
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: avalanche-publicnode
        endpoint: https://avalanche-c-chain-rpc.publicnode.com
        # PublicNode rejects indexer backfill log filters with HTTP 403 / -32602.
        ignoreMethods:
          - eth_getLogs
        evm:
          chainId: 43114
          skipSyncingCheck: true
      - id: telos-rpc
        endpoint: https://rpc.telos.net
        evm:
          chainId: 40
          skipSyncingCheck: true
      - id: telos-1rpc
        endpoint: https://1rpc.io/telos/evm
        evm:
          chainId: 40
          skipSyncingCheck: true
      - id: base-mainnet
        endpoint: https://mainnet.base.org
        evm:
          chainId: 8453
          skipSyncingCheck: true
      - id: base-publicnode
        endpoint: https://base-rpc.publicnode.com
        evm:
          chainId: 8453
          skipSyncingCheck: true
